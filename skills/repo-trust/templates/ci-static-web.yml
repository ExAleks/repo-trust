name: ci

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Local assets referenced by the HTML exist
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          refs = [m for m in re.findall(r'(?:src|href)="([^"]+)"', html)]
          missing = [r for r in refs
                     if not r.startswith(("http", "#", "data:", "//"))
                     and not pathlib.Path(r).exists()]
          if missing:
              print("missing local assets:\n  " + "\n  ".join(missing))
              sys.exit(1)
          print("all local assets present:", len(refs))
          EOF
